name: Stream Recorder
version: "2.0.1"
slug: stream_recorder
description: >-
  Record MP3 web radio streams on a schedule – track list and chapters from the
  stream titles, ID3 tags, lossless cutting into single tracks.
  / Zeitgesteuerte Aufnahme von MP3-Webradio-Streams – Titelliste und Kapitel,
  ID3-Tags, verlustfreies Schneiden in Einzeltitel.
url: https://github.com/BreitiDE/ha-stream-recorder
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:radio
panel_title: Stream Recorder
homeassistant_api: true
stdin: true
ports:
  8765/tcp: null
map:
  - type: media
    read_only: false
  - type: share
    read_only: false
backup_exclude:
  - "log/*"
  - "covers.db*"
options:
  storage_path: /media/stream-recorder
  username: ""
  password: ""
  log_level: info
schema:
  storage_path: match(^/(media|share)(/.*)?$)
  username: str?
  password: password?
  log_level: list(debug|info|warning|error)
